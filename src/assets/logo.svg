<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Premium radial glow gradient for yellow circle -->
    <radialGradient id="yellowGlow" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#FFF066" />
      <stop offset="70%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#E5A900" />
    </radialGradient>
    <!-- Soft shadow for modern depth -->
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Outer Yellow Circle with Depth -->
  <circle cx="250" cy="250" r="230" fill="url(#yellowGlow)" filter="url(#subtleShadow)" stroke="#000000" stroke-width="12" />

  <!-- Inner Decorative Ring for Sporty / Premium Vibe -->
  <circle cx="250" cy="250" r="215" fill="none" stroke="#000000" stroke-width="3" stroke-dasharray="8 8" opacity="0.4" />

  <!-- Stylized Sporty 'R' -->
  <g fill="#000000">
    <!-- Vertical stem of R -->
    <rect x="180" y="125" width="48" height="250" rx="6" />
    
    <!-- Top curved loop of R -->
    <path d="M 220 125 
             C 320 125, 350 160, 350 215 
             C 350 270, 305 295, 220 295 
             L 220 247 
             C 270 247, 298 235, 298 210 
             C 298 185, 275 173, 220 173 
             Z" />
    
    <!-- Bold diagonal leg of R -->
    <path d="M 235 270 
             L 315 375 
             L 375 375 
             L 285 255 
             Z" rx="4" />
  </g>

  <!-- Stylized '10' Badge in Bottom-Left -->
  <g transform="translate(115, 255)">
    <!-- Small premium background tag for the 10 -->
    <rect x="0" y="0" width="55" height="110" rx="8" fill="#000000" />
    
    <!-- Number '1' -->
    <path d="M 18 25 L 18 85 M 10 35 L 18 25" stroke="#FFD700" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Number '0' -->
    <rect x="30" y="25" width="16" height="60" rx="8" stroke="#FFD700" stroke-width="7" fill="none" />
  </g>
</svg>
